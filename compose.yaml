services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BIBLIO_HOST: 0.0.0.0
      BIBLIO_DB_PATH: /data/biblio.sqlite3
      PORT: 8000
    volumes:
      - biblio-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  biblio-data:
  caddy-data:
  caddy-config:
